name: Namosa Module CI

on:
  pull_request:
    paths:
      - 'modules/**'
      - 'api/**'
      - 'lib/**'
      - 'database/**'
      - 'tests/**'
      - 'module.php'
      - 'composer.json'
      - '.github/workflows/control-center-ci.yml'
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - 'api/**'
      - 'lib/**'
      - 'database/**'
      - 'tests/**'
      - 'module.php'
      - 'composer.json'

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP syntax check
        run: find modules api lib tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
